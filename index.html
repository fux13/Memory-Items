<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#071525"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="QRH Memory"><link rel="apple-touch-icon" href="icon-192.png"><link rel="manifest" href="manifest.webmanifest"><title>King Air 350 Memory Trainer</title><style>*{box-sizing:border-box}:root{--b:#071525;--p:#10243b;--p2:#173451;--t:#eef6ff;--m:#9fb6ca;--a:#ff6b2c;--g:#35c98b;--r:#ff5f6d;--u:#55a7ff}body{margin:0;min-height:100vh;background:linear-gradient(145deg,#06111d,#0b2238);color:var(--t);font:16px system-ui,-apple-system,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}header{position:sticky;top:0;z-index:3;background:#071525ee;padding:16px 18px;border-bottom:1px solid #ffffff18}.brand{font-size:20px;font-weight:900}.sub,.note,.stats{color:var(--m)}main{max-width:760px;margin:auto;padding:18px}.grid,.controls,.tabs{display:grid;gap:10px}.grid,.controls,.tabs{grid-template-columns:1fr 1fr}.tabs{margin:14px 0}button,select{width:100%;border:0;border-radius:14px;padding:13px;font:800 15px system-ui;background:var(--u);color:#04101c}select,.secondary,.tabs button{background:var(--p);color:var(--t)}.tabs .active{background:var(--a);color:white}.card{background:linear-gradient(160deg,var(--p2),var(--p));border:1px solid #ffffff1c;border-radius:22px;padding:22px;min-height:350px}.eyebrow{color:var(--a);font-size:12px;font-weight:900;text-transform:uppercase}.title{font-size:27px;font-weight:900;line-height:1.12;margin:10px 0}.prompt{color:var(--m);margin:10px 0 24px}.answer{display:none;border-top:1px solid #ffffff1c;padding-top:18px}.show{display:block}.step{display:flex;gap:12px;margin:10px 0}.num{min-width:29px;height:29px;border-radius:9px;background:#ffffff12;display:grid;place-items:center;font-weight:900}.action{font-weight:800}.value{color:#ffd5c3;margin-top:3px}.controls{margin-top:14px}.three{grid-template-columns:1fr 1fr 1fr}.good{background:var(--g)}.bad{background:var(--r);color:white}.quizopt{display:block;text-align:left;margin:9px 0;background:var(--p2);color:var(--t)}.correct{outline:3px solid var(--g)}.wrong{outline:3px solid var(--r)}.stats{display:flex;justify-content:space-between;font-size:13px;margin:12px 3px}.note{font-size:12px;line-height:1.45}.hidden{display:none!important}@media(max-width:480px){.title{font-size:23px}.card{padding:18px}.grid,.three{grid-template-columns:1fr}}</style></head><body><header><div class="brand">King Air 350 · Memory Trainer</div><div class="sub">Offline-Flashcards & Quiz · QRH Revision 0</div></header><main><div class="grid"><select id="category" aria-label="Kategorie"></select><button id="shuffle">Neu mischen</button></div><div class="tabs"><button id="tabCards" class="active">Flashcards</button><button id="tabQuiz">Quiz</button></div><div class="stats"><span id="counter"></span><span id="score"></span></div><section id="app" class="card" aria-live="polite"></section><p class="note">Nur zu Trainingszwecken. Für den Flugbetrieb gilt ausschließlich das freigegebene, aktuelle QRH. Lernfortschritt wird lokal gespeichert.</p></main><script>"use strict";const items=[{"c": "Engine", "t": "Dual Engine Failure", "s": ["Landing gear|UP", "Flaps|UP", "Prop levers|FEATHER", "Airspeed|135 KIAS"]}, {"c": "Engine", "t": "Engine Fire or Failure in Flight", "s": ["Condition lever (affected engine)|FUEL CUTOFF", "Prop lever|FEATHER", "Firewall fuel valve|CLOSE", "If fire warning persists after approx. 10 seconds: Fire extinguisher|ACTUATE"]}, {"c": "Engine", "t": "Engine Fire on Ground", "s": ["Condition lever (affected engine)|FUEL CUTOFF", "Firewall fuel valve|CLOSE", "Starter switch|STARTER ONLY", "If fire warning persists after approx. 30 seconds: Fire extinguisher|ACTUATE"]}, {"c": "Engine", "t": "Emergency Evacuation", "s": ["Parkbrake|SET", "Condition levers (both)|FUEL CUTOFF", "Prop levers (both)|FEATHER", "Firewall fuel valves|CLOSE", "ATC|INFORM", "Master switch (gang bar)|OFF", "Evacuation|INITIATE", "Battery BUS|EMERG OFF", "ESIS power|OFF"]}, {"c": "Engine", "t": "Rejected Take-Off", "s": ["Power levers|GROUND FINE", "Brakes|MAXIMUM or AS REQ to stop safely", "Parkbrake|SET"]}, {"c": "Engine", "t": "Engine Failure after V1", "s": ["At VR|ROTATE to approx. +10° pitch", "Landing gear|UP at positive climb indication", "Airspeed|MAINTAIN V2 to acceleration altitude", "Propeller (failed engine)|VERIFY FEATHERED"]}, {"c": "Engine", "t": "Engine Failure in Flight below VMCA", "s": ["Power|REDUCE AS REQ TO MAINTAIN CONTROL", "Nose|LOWER TO ACCELERATE ABOVE VMCA"]}, {"c": "Fuel", "t": "Fuel Pressure Low", "s": ["Standby pump (failed side)|ON"]}, {"c": "Smoke & Fire", "t": "Electrical Smoke or Fire", "s": ["Oxygen masks|DON", "Mask selector switch|EMERG", "Mic switches|OXY"]}, {"c": "Smoke & Fire", "t": "Air-Conditioning-System Smoke or Fumes", "s": ["Oxygen masks|DON", "Mask selector switches|EMERG", "Mic switches|OXY"]}, {"c": "Smoke & Fire", "t": "Cabin or PED Smoke or Fire", "s": ["Oxygen masks|DON", "Mask selector switches|EMERG", "Mic switches|OXY"]}, {"c": "Smoke & Fire", "t": "Flight Inspection System Smoke or Fire", "s": ["Oxygen masks|DON", "Mask selector switches|EMERG", "Mic switches|OXY"]}, {"c": "Cabin", "t": "Airstair Door Unlocked", "s": ["All occupants|SEATED WITH SEAT BELTS SECURELY FASTENED"]}, {"c": "Pressurisation", "t": "Pressurisation Loss", "s": ["Oxygen masks|DON", "Mic switches|OXY", "Passenger Manual Drop-Out|PULL ON", "Descend|AS REQ"]}, {"c": "Pressurisation", "t": "Auto-Deployment Oxygen System Failure", "s": ["Passenger Manual Drop-Out|PULL ON"]}, {"c": "Pressurisation", "t": "Use of Oxygen (Crew)", "s": ["Oxygen masks|DON", "Mic switches|OXY"]}, {"c": "Pressurisation", "t": "High Differential Pressure", "s": ["Bleed air valves|ENVIR OFF", "Oxygen (crew and passengers)|AS REQ", "Descend|AS REQ"]}, {"c": "Flight Path", "t": "Emergency Descent", "s": ["Power levers|IDLE", "Prop levers|FULL FORWARD", "Flaps|APPROACH BELOW 202 KIAS", "Landing Gear|DOWN BELOW 184 KIAS", "Descent|INITIATE", "Airspeed|KEEP MAX 184 KIAS"]}, {"c": "Electrical", "t": "Dual Generator Failure", "s": ["Instrument Emergency Lights|AS REQ", "Generators|RESET, then ON", "If EITHER generator will reset: Operating generator loadmeter|MONITOR", "If EITHER generator will reset: Diversion|CONSIDER", "If NEITHER generator will reset: ECS mode|OFF", "If NEITHER generator will reset: Cockpit and Cabin blowers|AUTO", "If NEITHER generator will reset: Non-essential equipment|OFF"]}, {"c": "Bleed Air", "t": "Single Bleed Air Fail", "s": ["Bleed Air Valve (affected engine)|PNEU & ENVIR OFF"]}, {"c": "Bleed Air", "t": "Dual Bleed Air Fail", "s": ["Bleed Air Valves (both engines)|PNEU & ENVIR OFF"]}, {"c": "Flight Controls", "t": "Spins", "s": ["Control column|FULL FORWARD (MAX PITCH -90°)", "Ailerons|NEUTRAL", "Rudder|FULL OPPOSITE THE SPIN DIRECTION", "Power levers|IDLE", "Rudder|NEUTRALIZE WHEN ROTATION STOPS", "Smooth pullout|EXECUTE"]}, {"c": "Flight Controls", "t": "Unscheduled Electric Pitch Trim Activation", "s": ["Airplane attitude|MAINTAIN USING ELEVATOR CONTROL", "AP/Trim Disconnect|DEPRESS FULLY & HOLD"]}, {"c": "Flight Controls", "t": "Unscheduled Rudder Boost Activation", "s": ["AP/Trim Disconnect|DEPRESS TO 1st LEVEL AND HOLD", "Rudder Boost switch|OFF", "If condition persists: YD / AP DISC|PULL DOWN"]}, {"c": "Avionics", "t": "Autopilot Mistrim [E] or [A]", "s": ["Flight Controls|HOLD FIRMLY", "AP|DISENGAGE"]}, {"c": "Avionics", "t": "Autopilot Trim Failure", "s": ["Flight controls|HOLD FIRMLY", "AP|DISENGAGE"]}, {"c": "Avionics", "t": "Autopilot Automatic Disengagement", "s": ["Aircraft control|MAINTAIN MANUALLY", "AP/TRIM disconnect|DEPRESS TO 1st LEVEL TO CANCEL HORN"]}, {"c": "Terrain", "t": "TAWS/EGPWS Alert in IMC or at Night", "s": ["Autopilot|DISCONNECT", "Wings|LEVEL", "Power|MAX ALLOWABLE", "Pitch|INCREASE", "Gear and Flaps|UP"]}, {"c": "Engine", "t": "Hot Start or Hung Start", "s": ["Condition lever|FUEL CUTOFF", "Ignition and engine start|STARTER ONLY", "When ITT is below 400°C: Ignition and engine start|OFF"]}, {"c": "Engine", "t": "No Light Start", "s": ["Condition lever|FUEL OFF", "Ignition and engine start|OFF"]}];const $=s=>document.querySelector(s);let mode="cards",pool=[],idx=0,correct=0,answered=0;const cat=$("#category"),app=$("#app");const cats=["Alle Kategorien",...new Set(items.map(x=>x.c))];cat.innerHTML=cats.map(x=>`<option>${x}</option>`).join("");cat.value=cats.includes(localStorage.getItem("qrhCat"))?localStorage.getItem("qrhCat"):cats[0];function mix(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}function split(v){const p=v.indexOf("|");return [v.slice(0,p),v.slice(p+1)]}function steps(x){return x.s.map((v,n)=>{const [a,b]=split(v);return `<div class="step"><div class="num">${n+1}</div><div><div class="action">${esc(a)}</div><div class="value">${esc(b)}</div></div></div>`}).join("")}function updateStats(){$("#counter").textContent=pool.length?`${idx+1} / ${pool.length}`:"0 Items";$("#score").textContent=mode==="quiz"?`Richtig: ${correct}/${answered}`:`Gewusst: ${localStorage.getItem("qrhKnown")||0}`}function reset(){pool=mix(items.filter(x=>cat.value===cats[0]||x.c===cat.value));idx=0;render()}function next(){if(pool.length)idx=(idx+1)%pool.length;render()}function render(){updateStats();if(!pool.length){app.textContent="Keine Items in dieser Kategorie.";return}const x=pool[idx];mode==="cards"?card(x):quiz(x)}function card(x){app.innerHTML=`<div class="eyebrow">${esc(x.c)}</div><div class="title">${esc(x.t)}</div><div class="prompt">Nenne die Memory Items in der richtigen Reihenfolge.</div><div id="answer" class="answer">${steps(x)}</div><div class="controls"><button id="show">Antwort zeigen</button><button id="next" class="secondary">Nächstes</button></div><div id="rating" class="controls three hidden"><button class="bad" data-rate="0">Nochmal</button><button class="secondary" data-rate="1">Unsicher</button><button class="good" data-rate="2">Gewusst</button></div>`;$("#show").addEventListener("click",e=>{$("#answer").classList.add("show");e.currentTarget.classList.add("hidden");$("#rating").classList.remove("hidden")});$("#next").addEventListener("click",next);app.querySelectorAll("[data-rate]").forEach(b=>b.addEventListener("click",()=>{if(b.dataset.rate==="2")localStorage.setItem("qrhKnown",String(Number(localStorage.getItem("qrhKnown")||0)+1));next()}))}function quiz(x){const [action,value]=split(x.s[Math.floor(Math.random()*x.s.length)]);const all=[...new Set(items.flatMap(z=>z.s.map(v=>split(v)[1])))].filter(v=>v!==value);const opts=mix([value,...mix(all).slice(0,Math.min(3,all.length))]);app.innerHTML=`<div class="eyebrow">${esc(x.c)} · Quiz</div><div class="title">${esc(x.t)}</div><div class="prompt">Welche Aktion gehört zu: <strong>${esc(action)}</strong>?</div><div id="options">${opts.map((o,n)=>`<button class="quizopt" data-index="${n}">${esc(o)}</button>`).join("")}</div><div id="explain" class="answer">${steps(x)}</div><div class="controls"><button id="qnext" class="secondary">Nächste Frage</button></div>`;const buttons=[...app.querySelectorAll(".quizopt")];buttons.forEach((b,n)=>b.addEventListener("click",()=>{if(app.dataset.answered==="1")return;app.dataset.answered="1";answered++;if(opts[n]===value){b.classList.add("correct");correct++}else{b.classList.add("wrong");buttons[opts.indexOf(value)].classList.add("correct")}$("#explain").classList.add("show");updateStats()}));$("#qnext").addEventListener("click",()=>{delete app.dataset.answered;next()})}cat.addEventListener("change",()=>{localStorage.setItem("qrhCat",cat.value);reset()});$("#shuffle").addEventListener("click",reset);$("#tabCards").addEventListener("click",()=>{mode="cards";$("#tabCards").classList.add("active");$("#tabQuiz").classList.remove("active");reset()});$("#tabQuiz").addEventListener("click",()=>{mode="quiz";$("#tabQuiz").classList.add("active");$("#tabCards").classList.remove("active");reset()});if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(console.error));reset();</script></body></html>
